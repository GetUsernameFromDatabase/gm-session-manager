version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  exclusions:
    generated: lax
    paths:
      - internal/db/sqlc
      # Installed and updated by the shadcn-templ CLI; not edited by hand.
      - internal/web/components
      - internal/web/utils
      - ".*_templ\\.go$"
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/db/sqlc
      - internal/web/components
      - internal/web/utils
      - '.*_templ\.go$'
  settings:
    goimports:
      local-prefixes: [gm-session-manager]
