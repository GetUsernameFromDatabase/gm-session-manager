version: "2"

run:
  build-tags: [nomsgpack] # same build as release (build.sh): a gin msgpack use fails here, not at release

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - goconst
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        # Game systems (CLAUDE.md): neutral code reaches dnd5e only through
        # sheet5e.go. Globs start with ** so they hold wherever lint runs.
        neutral:
          files:
            - $all
            - "!$test"
            - "!**/internal/dnd5e/**"
            - "!**/internal/compendium/**"
            - "!**/internal/web/sheet5e*.go"
            - "!**/internal/web/views/sheet5e.go"
            - "!**/internal/web/views/character_live.go"
            - "!**/internal/web/views/{builder,character,compendium,entry,homebrew,levelup,sources,wizard}_{templ,view}.go"
          deny:
            - pkg: gm-session-manager/internal/dnd5e
              desc: system-neutral code; go through sheet5e.go
        # Neutral code also stays out of the 5e-shaped compendium. The files
        # after the neutral list are the visible debt: do not grow it without reason.
        compendium:
          files:
            # Same 5e list as `neutral`: keep the two in step.
            - $all
            - "!$test"
            - "!**/internal/dnd5e/**"
            - "!**/internal/compendium/**"
            - "!**/internal/web/sheet5e*.go"
            - "!**/internal/web/views/sheet5e.go"
            - "!**/internal/web/views/character_live.go"
            - "!**/internal/web/views/{builder,character,compendium,entry,homebrew,levelup,sources,wizard}_{templ,view}.go"
            - "!**/internal/web/{compendium_handlers,fivetools_handlers,habitat_handlers,homebrew_handlers,import_job,settings,dm_handlers}.go"
            - "!**/internal/export/archive.go"
            - "!**/cmd/gm-session-manager/main.go"
            - "!**/internal/web/views/import_{templ,view}.go"
            - "!**/internal/web/views/habitats_{templ,view}.go"
            - "!**/internal/web/views/layout_view.go"
          deny:
            - pkg: gm-session-manager/internal/compendium
              desc: system-neutral code; the compendium is 5e-shaped, go through sheet5e.go
    goconst:
      min-len: 3
      min-occurrences: 3
      match-constant: true
  exclusions:
    # Not lax: generated templ files must still reach depguard (rule below).
    generated: disable
    paths:
      - internal/db/sqlc
      # Installed and updated by the shadcn-templ CLI; not edited by hand.
      - internal/web/components
      - internal/web/utils
    rules:
      # Generated templ code answers to depguard only. A newly enabled
      # linter goes in this list too.
      - path: _templ\.go$
        linters: [bodyclose, errcheck, errorlint, goconst, gosec, govet, ineffassign, misspell, noctx, revive, rowserrcheck, sqlclosecheck, staticcheck, unconvert, unparam, unused]
      - path: _test\.go
        linters: [gosec]
      # Test data repeats on purpose, and goconst matches text, not meaning.
      - path: _test\.go
        linters: [goconst]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/db/sqlc
      - internal/web/components
      - internal/web/utils
      - '.*_templ\.go$'
  settings:
    goimports:
      local-prefixes: [gm-session-manager]
