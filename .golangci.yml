version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - goconst
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
      match-constant: true
  exclusions:
    generated: lax
    paths:
      - internal/db/sqlc
      # Installed and updated by the shadcn-templ CLI; not edited by hand.
      - internal/web/components
      - internal/web/utils
      - ".*_templ\\.go$"
    rules:
      - path: _test\.go
        linters: [gosec]
      # Test data repeats on purpose, and goconst matches text, not meaning.
      - path: _test\.go
        linters: [goconst]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/db/sqlc
      - internal/web/components
      - internal/web/utils
      - '.*_templ\.go$'
  settings:
    goimports:
      local-prefixes: [gm-session-manager]
